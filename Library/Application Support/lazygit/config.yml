gui:
  nerdFontsVersion: "3"
  showNumstatInFilesView: true
  # theme:
  #   activeBorderColor:
  #     - "#ff9e3b"
  #     - "bold"
  #   inactiveBorderColor:
  #     - "#54546d"
  #   searchingActiveBorderColor:
  #     - "#ff9e3b"
  #     - "bold"
  #   optionsTextColor:
  #     - "#7e9cd8"
  #   selectedLineBgColor:
  #     - "#223249"
  #   cherryPickedCommitBgColor:
  #     - "#e6c384"
  #   cherryPickedCommitFgColor:
  #     - "#7e9cd8"
  #   unstagedChangesColor:
  #     - "#e82424"
  #   defaultFgColor:
  #     - "#dcd7ba"
  # ANSI color names only, so lazygit follows the Rex terminal theme.
  theme:
    activeBorderColor:
      - yellow
      - bold
    searchingActiveBorderColor:
      - yellow
      - bold
    optionsTextColor:
      - blue
    cherryPickedCommitBgColor:
      - yellow
    cherryPickedCommitFgColor:
      - blue
    unstagedChangesColor:
      - red
os:
  openLink: open "$(echo {{link}} | sed 's/%2F/\//g')"
  editPreset: "nvim"
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      # command: delta --dark --syntax-theme=kanagawa-wave --paging=never --line-numbers --true-color=always --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      command: delta --paging=never --line-numbers --true-color=always --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
