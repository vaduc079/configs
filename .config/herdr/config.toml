# herdr configuration
# Mirrors the tmux/Ghostty workflow in this dotfiles repo.

onboarding = false

[advanced]
scrollback_limit_bytes = 5000000

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
accent = "cyan"
surface_dim = "#383838"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+a"

# tmux-style prefix actions
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+n"
new_worktree = "prefix+shift+g"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
focus_agent = "prefix+ctrl+1..9"

# tmux windows map to Herdr tabs.
new_tab = "prefix+c"
previous_tab = "prefix+shift+tab"
next_tab = "prefix+tab"
switch_tab = "ctrl+1..9"
switch_workspace = "prefix+1..9"
rename_tab = "prefix+shift+t"
close_tab = ""

# tmux pane movement and management.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
last_pane = "ctrl+backslash"
cycle_pane_next = ""
cycle_pane_previous = ""
split_vertical = "prefix+v"
split_horizontal = ["prefix+minus", "ctrl+shift+enter"]
close_pane = ["prefix+x", "prefix+shift+x"]
zoom = ["prefix+z", "prefix+ctrl+z"]
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

# Navigate-mode keeps the same home-row movement as the tmux key tables.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# tmux arrange-mode equivalents.
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+ctrl+f"
type = "pane"
command = "~/configs/.config/zsh/scripts/herdr-sessionizer.sh"
description = "open workspace from directory picker"

[[keys.command]]
key = "ctrl+enter"
type = "plugin_action"
command = "local.smart-pane-navigation.smart-split"
description = "smart pane split"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.smart-pane-navigation.navigate-left"
description = "vim-aware pane focus left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.smart-pane-navigation.navigate-down"
description = "vim-aware pane focus down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.smart-pane-navigation.navigate-up"
description = "vim-aware pane focus up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.smart-pane-navigation.navigate-right"
description = "vim-aware pane focus right"

[[keys.command]]
key = "prefix+ctrl+d"
type = "pane"
command = "lumen diff"
description = "run lumen diff"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "mise exec -- lazygit"
description = "run lazygit"
width = "90%"
height = "90%"

[ui]
mouse_capture = true
confirm_close = false
prompt_new_tab_name = false
pane_borders = true
pane_outer_borders = false
pane_scrollbars = false
pane_gaps = false
show_agent_labels_on_pane_borders = false
accent = "cyan"
agent_panel_sort = "spaces"
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true
tab_bar_position = "top"
tab_bar_right = [{ type = "zoom" }]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "workspace", dim = true },
    "agent",
    "tab",
  ],
  [
    { token = "terminal_title_stripped", fg = "#ebdbb2", dim = false },
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    { token = "workspace", dim = true },
    { token = "agent", fg = "#d97757", dim = true },
    "tab",
  ],
  [
    { token = "terminal_title_stripped", fg = "#ebdbb2", dim = false },
  ],
]
codex = [
  [
    "state_icon",
    { token = "workspace", dim = true },
    { token = "agent", fg = "#689D6A", dim = true },
    "tab",
  ],
  [
    { token = "terminal_title_stripped", fg = "#ebdbb2", dim = false },
  ],
]
opencode = [
  [
    "state_icon",
    { token = "workspace", dim = true },
    { token = "agent", fg = "#79B8FF", dim = true },
    "tab",
  ],
  [
    { token = "terminal_title_stripped", fg = "#ebdbb2", dim = false },
  ],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
delivery = "terminal"
