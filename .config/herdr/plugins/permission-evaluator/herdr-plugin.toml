id = "local.permission-evaluator"
name = "Permission Evaluator"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Queue agent permission prompts from harness hooks and approve safe ones through Herdr."
platforms = ["macos", "linux"]

# Evaluation is driven by harness permission hooks (queue.js) and the launchd runner (runner.js),
# not by Herdr events: Herdr reports one status change for several back-to-back prompts.

[[actions]]
id = "audit-view"
title = "Open permission audit viewer"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "audit-viewer.js", "--background"]

[[actions]]
id = "audit-view-stop"
title = "Stop permission audit viewer"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "audit-viewer.js", "--stop"]
