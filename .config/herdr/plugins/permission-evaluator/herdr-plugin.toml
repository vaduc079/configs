id = "local.permission-evaluator"
name = "Permission Evaluator"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Queue agent permission prompts from harness hooks and approve safe ones through Herdr."
platforms = ["macos", "linux"]

# Evaluation is driven by harness permission hooks (queue.js), which start runner.js, plus a launchd sweep,
# not by Herdr events: Herdr reports one status change for several back-to-back prompts.

[[actions]]
id = "dashboard"
title = "Open permission dashboard"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "dashboard.js", "--background"]

[[actions]]
id = "dashboard-stop"
title = "Stop permission dashboard"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "dashboard.js", "--stop"]
