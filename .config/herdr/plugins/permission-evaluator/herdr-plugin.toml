id = "local.permission-evaluator"
name = "Permission Evaluator"
version = "0.3.0"
min_herdr_version = "0.9.1"
description = "Open the permission evaluator dashboard."
platforms = ["macos", "linux"]

# Only the dashboard actions live here. The evaluator runs from the agent harness's permission hook
# and a launchd sweep, independent of Herdr: see ~/configs/tools/permission-evaluator/README.md.

[[actions]]
id = "dashboard"
title = "Open permission dashboard"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "/Users/duc.vu/configs/tools/permission-evaluator/dashboard.js", "--background"]

[[actions]]
id = "dashboard-stop"
title = "Stop permission dashboard"
contexts = ["workspace", "tab", "pane"]
command = ["bun", "/Users/duc.vu/configs/tools/permission-evaluator/dashboard.js", "--stop"]
